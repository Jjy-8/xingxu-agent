</style></head><body><div class="sidebar-backdrop" id="sidebarBackdrop"></div><div class="app"><aside class="sidebar" id="sidebar"><button class="sidebar-close" id="sidebarClose" aria-label="Close navigation">&times;</button><div class="brand"><div class="seal">序</div><div>星序<small>XINGXU</small></div></div><div class="section">命主档案</div><div class="list" id="profileList"></div><button class="item" id="addProfile">＋ 新增命主</button><div class="section">历史会话</div><div class="list" id="sessionList"></div><div class="sidebar-foot">所有功能免费开放<br>数据保存在当前浏览器</div></aside><main class="main"><header class="top"><button class="mobile-menu" id="mobileMenu" aria-label="Open Xingxu navigation" aria-controls="sidebar" aria-expanded="false">&#9776;</button><div><h1 id="pageTitle">新的命理推演 <span class="badge">命盘已就绪</span></h1><div class="subject" id="subjectLine"></div></div><div class="top-actions"><button id="newQuestion" class="new-question" hidden>继续提问</button><button id="saveReport">保存为报告</button></div></header><section class="view active" id="chatView"><div class="scroll"><div class="hero" id="hero"><div class="cosmos-strip" aria-label="Bagua compass"><div class="yin-yang">&#9775;</div><div class="trigram-ring"><span class="trigram">&#9776;</span><span class="trigram">&#9777;</span><span class="trigram">&#9778;</span><span class="trigram">&#9779;</span><span class="trigram">&#9780;</span><span class="trigram">&#9781;</span><span class="trigram">&#9782;</span><span class="trigram">&#9783;</span></div></div><div class="agent"><div class="seal">序</div><div><b>星序推演 Agent</b><small>命盘证据驱动 · 结论可追溯</small></div></div><h2>从同一张命盘出发，<br>把问题推演到行动。</h2><p>先选择体系，再提出一个具体问题。右侧命盘、推演步骤与最终报告共享同一份命主数据。</p><div class="modes"><button class="mode-card active" data-mode="ziwei"><span>紫</span><b>紫微斗数</b><small>看性格优势、事业财运、感情家庭和人生阶段</small></button><button class="mode-card" data-mode="sizhu"><span>柱</span><b>四柱八字</b><small>逐柱看十神、藏干、纳音、六亲和人生阶段</small></button><button class="mode-card" data-mode="qimen"><span>奇</span><b>奇门遁甲</b><small>看方向选择、行动时机、可行方案和风险提醒</small></button></div><div class="quick"><button data-q="请做一次全盘结构解析，重点看事业优势。">全盘事业解析</button><button data-q="未来半年适合换工作吗？有哪些时间窗口？">换工作时机</button><button data-q="这段关系为何反复出现同类冲突？">关系模式</button><button data-q="请分析本年的重点月份与风险。">流年重点</button></div></div><div class="conversation" id="conversation"><div class="ask" id="question"></div><div class="trace"><div class="trace-title" id="traceTitle"></div><div class="trace-list" id="traceList"></div></div><div class="answer"><h3 id="answerTitle"></h3><div class="decision-grid"><div class="decision good"><small>宜</small><b id="doGood"></b></div><div class="decision caution"><small>慎</small><b id="doCaution"></b></div><div class="decision avoid"><small>忌</small><b id="doAvoid"></b></div><div class="decision joy"><small>喜</small><b id="doJoy"></b></div></div><section class="action-section"><h4>最终执行结果</h4><span id="action"></span></section><div class="evidence" id="evidence"></div><section class="reasoning-section"><h4>推理过程</h4><p id="answerSummary"></p></section></div></div></div><div class="inline-chart"><div class="inline-chart-head"><div><b>命盘与提问</b><small>切换体系后，下方问题将引用同一位命主的当前盘面</small></div><div class="inline-tabs"><button class="active" data-inline-panel="ziwei">紫微</button><button data-inline-panel="sizhu">四柱</button><button data-inline-panel="qimen">奇门</button></div></div><div id="inlineChartContent"></div></div><div class="composer"><div class="input"><div class="composer-modes" aria-label="选择推演体系"><button type="button" class="active" data-compose-mode="ziwei">紫微</button><button type="button" data-compose-mode="sizhu">四柱</button><button type="button" data-compose-mode="qimen">奇门</button></div><textarea id="prompt" placeholder="一次聚焦一个问题，星序会引用当前命盘作答…"></textarea><div class="tools"><button class="mode-btn" id="modeButton">◎ 紫微斗数</button><button class="send" id="send">↑</button></div></div></div></section><section class="view" id="chartView"><div class="chart-page" id="chartPage"></div></section><section class="view" id="reportsView"><div class="report-list" id="reportList"></div></section></main><aside class="right"><header class="right-head"><b>当前命盘</b><span class="badge" id="chartStatus">已锁定</span></header><div class="right-tabs"><button class="active" data-panel="ziwei">紫微</button><button data-panel="sizhu">四柱</button><button data-panel="qimen">奇门</button><button data-panel="sources">依据</button></div><div class="right-body"><div class="owner"><div><b id="ownerName"></b><small id="ownerMeta"></small></div><button id="editProfile">编辑资料</button></div><div id="panelContent"></div></div></aside></div><div class="modal open" id="modal"><div class="dialog"><button class="close" id="closeModal">×</button><h2 id="modalTitle">建立命主档案</h2><p>出生信息用于生成统一命盘。后续对话、推演依据和报告都绑定到这位命主。</p><form class="form" id="profileForm"><div class="field"><label>称呼</label><input id="name" required value="林遇"></div><div class="field"><label>性别</label><select id="gender"><option>女</option><option>男</option></select></div><div class="field"><label>公历生日</label><input id="birth" type="date" required value="1992-08-17"></div><div class="field"><label>出生时间</label><input id="time" type="time" required value="09:30"></div><div class="field full"><label>出生地点</label><input id="place" required value="成都"></div><button class="save">保存命主并生成命盘</button></form></div></div><script src="./iztro.min.js"></script><script>
const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s);const chatScroll=document.querySelector('#chatView .scroll'),inlineChart=document.querySelector('.inline-chart'),chatComposer=document.querySelector('#chatView .composer'),chatConversation=document.querySelector('#conversation');if(chatScroll&&inlineChart&&chatComposer&&chatConversation){chatConversation.before(inlineChart,chatComposer)}const sidebar=$("#sidebar"),mobileMenu=$("#mobileMenu"),sidebarClose=$("#sidebarClose"),sidebarBackdrop=$("#sidebarBackdrop");function setSidebar(open){sidebar.classList.toggle("open",open);sidebarBackdrop.classList.toggle("open",open);mobileMenu.setAttribute("aria-expanded",String(open));document.body.classList.toggle("menu-open",open)}mobileMenu.onclick=()=>setSidebar(true);sidebarClose.onclick=()=>setSidebar(false);sidebarBackdrop.onclick=()=>setSidebar(false);document.addEventListener("keydown",e=>{if(e.key==="Escape")setSidebar(false)});const gan=['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'],zhi=['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'],elements=['木','木','火','火','土','土','金','金','水','水'],branches=['水','土','木','木','土','火','火','土','金','金','土','水'],palaceNames=['命宫','兄弟','夫妻','子女','财帛','疾厄','迁移','交友','官禄','田宅','福德','父母'],stars=['紫微 天府','天机 太阴','贪狼','巨门','武曲 天相','天同 天梁','七杀','太阳','廉贞 破军','太阴','天府','天机'];const MODE={ziwei:'紫微斗数',sizhu:'四柱八字',qimen:'奇门遁甲'},COURSE={title:'断法依据',url:'',modules:{ziwei:'所问宫、三方四正、主星与四化合断',sizhu:'日主、月令、十神与藏干合断',qimen:'门定事体、星看环境、宫看落点'}};let state={profiles:[],activeProfileId:null,sessions:[],activeSessionId:null,reports:[],mode:'ziwei',panel:'ziwei'};function mod(n,m){return((n%m)+m)%m}function calcChart(p){let[y,m,d]=p.birth.split('-').map(Number),h=+p.time.slice(0,2),ys=mod(y-4,10),yb=mod(y-4,12),mi=mod(m+1,12),ms=mod(ys*2+mi+2,10),di=mod(Math.floor(Date.UTC(y,m-1,d)/864e5)+15,60),ds=di%10,db=di%12,hi=Math.floor(mod(h+1,24)/2),hs=mod(ds*2+hi,10),pillars=[[ys,yb,'年柱'],[ms,mi,'月柱'],[ds,db,'日柱'],[hs,hi,'时柱']],life=mod(m-hi,12),counts={木:0,火:0,土:0,金:0,水:0};pillars.forEach(x=>{counts[elements[x[0]]]++;counts[branches[x[1]]]++});let ti=h===23?12:Math.floor((h+1)/2),astroData=null;try{astroData=window.iztro.astro.bySolar(p.birth.replace(/-0/g,'-'),ti,p.gender,true,'zh-CN')}catch(e){}let palaces=astroData?astroData.palaces.map((x,i)=>{let all=[...(x.majorStars||[]),...(x.minorStars||[])];return{name:x.name,branch:x.earthlyBranch,stars:all.slice(0,3).map(s=>s.name+(s.brightness?`〔${s.brightness}〕`:'')).join(' ')||'无主星',transform:all.map(s=>s.mutagen).filter(Boolean).join(' ')||x.changsheng12,active:x.name==='命宫',raw:x}}):Array.from({length:12},(_,i)=>({name:palaceNames[mod(i-life,12)],branch:zhi[mod(i+2,12)],stars:'排盘库未加载',transform:'—',active:i===life}));let soul=astroData?.earthlyBranchOfSoulPalace||palaces.find(x=>x.active)?.branch,body=astroData?.earthlyBranchOfBodyPalace||'',meta=astroData?{lunarDate:astroData.lunarDate,chineseDate:astroData.chineseDate,soul:astroData.soul,body:astroData.body,fiveElementsClass:astroData.fiveElementsClass,zodiac:astroData.zodiac}:{};return{pillars,dayMaster:gan[ds]+elements[ds],lifeBranch:soul,bodyBranch:body,counts,palaces,meta,qimen:{bureau:mod(y+m+d+h,9)+1,gate:['开门','休门','生门','伤门','杜门','景门','死门','惊门'][mod(d+h,8)],star:['天蓬','天任','天冲','天辅','天英','天芮','天柱','天心','天禽'][mod(y+d,9)]}}}function activeProfile(){return state.profiles.find(x=>x.id===state.activeProfileId)}function save(){localStorage.setItem('xingxu-v3',JSON.stringify(state))}function load(){try{let raw=localStorage.getItem('xingxu-v3');if(raw)raw=raw.replace(/20(?:26)\s*年/g,'本年');let x=JSON.parse(raw);if(x&&Array.isArray(x.profiles)){x.profiles=x.profiles.filter(p=>p&&typeof p.name==='string'&&p.name.trim()&&/^\d{4}-\d{2}-\d{2}$/.test(p.birth||'')&&/^\d{2}:\d{2}$/.test(p.time||''));x.profiles.forEach(p=>{p.place=p.place||'未填写';p.gender=p.gender||'女';p.chart=calcChart(p)});x.sessions=Array.isArray(x.sessions)?x.sessions.filter(s=>s&&s.mode!=='bazi'&&x.profiles.some(p=>p.id===s.profileId)&&s.inference):[];x.reports=Array.isArray(x.reports)?x.reports.filter(r=>r&&r.mode!=='bazi'&&x.profiles.some(p=>p.id===r.profileId)):[];if(x.mode==='bazi')x.mode='ziwei';if(x.panel==='bazi')x.panel='sizhu';x.activeProfileId=x.profiles.some(p=>p.id===x.activeProfileId)?x.activeProfileId:(x.profiles[0]?.id||null);x.activeSessionId=x.sessions.some(s=>s.id===x.activeSessionId)?x.activeSessionId:null;state={...state,...x}}}catch(e){try{localStorage.removeItem('xingxu-v3')}catch(_){}}}function renderProfiles(){profileList.innerHTML=state.profiles.map(p=>`<button class="item person ${p.id===state.activeProfileId?'active':''}" data-p="${p.id}"><span class="avatar">${p.name[0]}</span><span>${p.name}<small>${p.birth} · ${p.place}</small></span></button>`).join('');$$('[data-p]').forEach(b=>b.onclick=()=>{state.activeProfileId=b.dataset.p;renderAll();save()})}function renderSessions(){sessionList.innerHTML=state.sessions.filter(s=>s.profileId===state.activeProfileId).map(s=>`<button class="item ${s.id===state.activeSessionId?'active':''}" data-s="${s.id}">${s.question}</button>`).join('')||'<span style="padding:8px;color:#607c72;font-size:9px">暂无历史会话</span>';$$('[data-s]').forEach(b=>b.onclick=()=>{let s=state.sessions.find(x=>x.id===b.dataset.s);state.activeSessionId=s.id;state.mode=s.mode;showSession(s);renderSessions()})}function pillarHTML(c){let max=Math.max(...Object.values(c.counts),1),bars=Object.entries(c.counts).map(([k,v])=>`<div class="element-row"><b>${k}</b><div class="element-track"><div class="element-fill" style="width:${Math.max(8,v/max*100)}%"></div></div><span>${v}</span></div>`).join('');return`<div class="box"><div class="box-title"><b>${'\u56db\u67f1\u516b\u5b57'}</b><small>${'\u65e5\u4e3b'} ${c.dayMaster}</small></div><div class="pillars">${c.pillars.map(x=>`<div class="pillar"><small>${x[2]}</small><div class="chars">${gan[x[0]]}<br>${zhi[x[1]]}</div><div class="element">${elements[x[0]]} · ${branches[x[1]]}</div></div>`).join('')}</div><div class="element-bars">${bars}</div></div>`}const hiddenStems=[[9],[5,9,7],[0,2,4],[1],[4,1,9],[2,4,6],[3,5],[5,3,1],[6,8,4],[7],[4,7,3],[8,0]],naYin=['海中金','炉中火','大林木','路旁土','剑锋金','山头火','涧下水','城头土','白蜡金','杨柳木','泉中水','屋上土','霹雳火','松柏木','长流水','沙中金','山下火','平地木','壁上土','金箔金','佛灯火','天河水','大驿土','钗钏金','桑柘木','大溪水','沙中土','天上火','石榴木','大海水'];function tenGod(day,other){let de=Math.floor(day/2),oe=Math.floor(other/2),same=day%2===other%2;if(de===oe)return same?'比肩':'劫财';if((de+1)%5===oe)return same?'食神':'伤官';if((oe+1)%5===de)return same?'偏印':'正印';if((de+2)%5===oe)return same?'偏财':'正财';return same?'七杀':'正官'}function cycleIndex(g,b){for(let i=0;i<60;i++)if(i%10===g&&i%12===b)return i;return 0}function sizhuHTML(c){let day=c.pillars[2][0];return`<div class="box"><div class="box-title"><b>四柱八字详盘</b><small>日主 ${c.dayMaster}</small></div><div class="pillars">${c.pillars.map((x,i)=>`<div class="pillar"><small>${x[2]} · ${i===2?'日主':tenGod(day,x[0])}</small><div class="chars">${gan[x[0]]}<br>${zhi[x[1]]}</div><div class="element">藏干 ${hiddenStems[x[1]].map(h=>gan[h]+'·'+tenGod(day,h)).join(' ')}</div><div class="element">${naYin[Math.floor(cycleIndex(x[0],x[1])/2)]}</div></div>`).join('')}</div><div class="system-note">年柱看根基与早年，月柱看月令与事业基础，日柱看命主与亲密关系，时柱看后续发展与晚景。十神全部以日干为中心推导。</div></div>`}function palaceHTML(c){return`<div class="box"><div class="box-title"><b>紫微十二宫</b><small>命宫 ${c.lifeBranch}</small></div><div class="palaces">${c.palaces.map(x=>`<div class="palace ${x.active?'active':''}"><b>${x.name}</b><span>${x.stars}</span><small>${x.branch} · ${x.transform}</small></div>`).join('')}</div></div>`}function qimenHTML(c){let names=['\u574e\u4e00\u5bab','\u5764\u4e8c\u5bab','\u9707\u4e09\u5bab','\u5dfd\u56db\u5bab','\u4e2d\u4e94\u5bab','\u4e7e\u516d\u5bab','\u5151\u4e03\u5bab','\u826e\u516b\u5bab','\u79bb\u4e5d\u5bab'],gates=['\u4f11\u95e8','\u751f\u95e8','\u4f24\u95e8','\u675c\u95e8','\u666f\u95e8','\u6b7b\u95e8','\u60ca\u95e8','\u5f00\u95e8','\u4e2d\u5bab'],qstars=['\u5929\u84ec','\u5929\u82ae','\u5929\u51b2','\u5929\u8f85','\u5929\u79bd','\u5929\u5fc3','\u5929\u67f1','\u5929\u4efb','\u5929\u82f1'],seed=c.qimen.bureau+c.pillars.reduce((n,x)=>n+x[0]+x[1],0),cells=names.map((n,i)=>{let idx=mod(i+seed,9),active=i===mod(seed,9);return`<div class="qimen-cell ${active?'active':''}"><small>${n}</small><b>${gates[idx]}</b><span>${qstars[mod(idx+c.qimen.bureau,9)]}</span></div>`}).join('');return`<div class="box"><div class="box-title"><b>${'\u4e5d\u5bab\u5947\u95e8\u4e2a\u4eba\u65f6\u7a7a\u5c40'}</b><small>${'\u9633\u9041'} ${c.qimen.bureau} ${'\u5c40'}</small></div><div class="qimen-grid">${cells}</div><div class="system-note">${'\u6839\u636e\u547d\u4e3b\u51fa\u751f\u5e74\u6708\u65e5\u65f6\u751f\u6210\u4e2a\u4eba\u7d22\u5f15\uff1b\u95ee\u4e8b\u5360\u6d4b\u4ecd\u9700\u53e6\u53d6\u4e8b\u4ef6\u53d1\u751f\u65f6\u95f4\u4e0e\u65b9\u4f4d\u8d77\u5c40\u3002'}</div></div>`}function renderPanel(){let p=activeProfile();if(!p)return;let c=p.chart;ownerName.textContent=p.name;ownerMeta.textContent=`${p.birth} ${p.time} · ${p.place} · ${p.gender}`;panelContent.innerHTML=state.panel==='ziwei'?palaceHTML(c):state.panel==='sizhu'?sizhuHTML(c):state.panel==='qimen'?qimenHTML(c):`<div class="box"><div class="box-title"><b>推演依据</b><small>结构可追溯</small></div><div class="citation">当前体系：${MODE[state.mode]} · ${COURSE.modules[state.mode]}</div><div class="citation">方法条目只在与当前命盘证据一致时引用，不跨体系套用。</div></div>`;inlineChartContent.innerHTML=state.panel==='ziwei'?palaceHTML(c):state.panel==='sizhu'?sizhuHTML(c):qimenHTML(c);chartPage.innerHTML=`<h2 style="font:600 22px var(--serif)">${p.name}的统一命盘</h2><p style="color:var(--muted)">${p.birth} ${p.time} · ${p.place}</p>${pillarHTML(c)}${sizhuHTML(c)}${palaceHTML(c)}${qimenHTML(c)}`}function detectTopic(q){let rules=[['relation',/男朋友|女朋友|对象|伴侣|爱人|丈夫|妻子|老公|老婆|夫妻|婚姻|恋爱|感情|这段关系|亲密关系|两人关系|正缘|相亲|复合|分手|暧昧/],['friendship',/闺蜜|朋友|友情|友谊|知己|发小|网友|社交|交友/],['parent',/父亲|母亲|爸爸|妈妈|父母|公婆|岳父|岳母|长辈|老人/],['sibling',/哥哥|弟弟|姐姐|妹妹|兄弟|姐妹|手足|堂兄|堂姐|表兄|表姐|亲戚|亲属/],['children',/儿子|女儿|子女|孩子|宝宝|晚辈| function everydayGuide(label){let rules=[[/事业|工作|职业/,'【适合】职责清楚、成果可见、经验能积累的岗位；已有经验先在原行业换岗位或团队。【行动】问清前三个月目标、直属上级、绩效和试用期标准，拿到书面录用再离职。【慎做】纯提成、权责不对等、长期无偿加班。【禁忌】忌受气裸辞，忌同时跨行业、跨职能、跨城市又大幅降薪。'],[/感情|关系|婚姻/,'【适合】说话算数、愿意公开关系、肯沟通并持续行动的人。【行动】把联系、见面、金钱边界和未来计划说具体，观察三个月是否兑现。【慎做】长期暧昧、反复失约、隐瞒事实的人。【禁忌】忌替对方背债，忌关系未稳定时共同借贷或放弃工作。'],[/财|收入|钱/,'【适合】先稳工资或主营收入，再发展副业。【行动】记录三个月收支、准备应急金，投资前写清最大损失和退出时间。【慎做】担保、熟人借款、短期暴利项目。【禁忌】忌借钱投资，忌全部存款押一个机会。'],[/朋友|社交|人际|合作|交易/,'【适合】尊重边界、有真实履历、能兑现并愿意留书面记录的人。【行动】涉及钱和项目时写清目标、分工、付款、验收和退出办法。【慎做】只讲人情不讲责任的关系。【禁忌】忌替人担保，忌只靠口头协议，忌违约后继续追加投入。'],[/家庭|父母|亲属|子女|长辈/,'【原则】分清感情、责任和控制。【行动】一次解决一件事，照护、住房和钱按实际能力分工。【慎做】长期替成年人承担后果。【禁忌】忌情绪勒索，忌生气时断绝关系，忌产权借款只留口头约定。'],[/健康|身心/,'【行动】连续七天记录睡眠、饮食、活动和不适；症状持续、加重或影响生活时直接就医。【慎做】自行长期服药或用偏方替代诊断。【禁忌】忌根据命盘判断疾病，忌拖延急症，忌停止正规治疗。'],[/学习|考试/,'【适合】能产出作品、证书、成绩或实际技能的目标。【行动】拆成两周任务，每周完成一次测验或作品。【慎做】同时报太多课程。【禁忌】忌只听不练，忌因一次成绩不好频繁换方向。'],[/迁移|搬|居住|家宅|房产/,'【适合】工作、住房成本、通勤、医疗都能承接的地方。【行动】先试住或走访，算清押金、交通和退出成本。【慎做】只因照片漂亮或短期情绪搬家。【禁忌】忌未看现场付款，忌超能力买房，忌把命理方位当安全证明。'],[/纠纷|规则|法律/,'【行动】保存合同、聊天、转账和时间线，重要权利咨询律师或相关机构。【慎做】公开争吵和情绪威胁。【禁忌】忌删除证据，忌不懂后果就签和解，忌用命理代替法律判断。']];return(rules.find(x=>x[0].test(label))||[0,'【行动】把问题写成一个对象、目标和期限，优先选结果可验证、成本可承受、失败能退出的方案。【慎做】信息不全时追加投入。【禁忌】忌情绪最强时作不可撤回决定，忌把命理当成现实保证。'])[1]}function longAction(label,base,anchor){return`【先说人话】${base}

${everydayGuide(label)}

【命理依据放最后】关键依据是${anchor}。它说明从哪里发力、哪里容易反复，不代表结果会自动发生。先抓主线，再处理旁支。

【第一步：定主次】先把当前问题写成一句能够作决定的话，只保留一个对象、一个目标和一个期限。今天就列出“必须得到的结果、可以接受的结果、绝对不能接受的结果”三栏。凡是与主问题无关的情绪、旧账、旁人意见先放到后面。盘面主轴已经指出力量集中处，第一步不是继续猜，而是顺着最强的宫位或信号，把最重要的事情先定下来。

【第二步：看人事】与此事有关的人分成三类：真正能拍板的人、能够提供信息或资源的人、只会带来干扰的人。先找能拍板的人谈结果，再找能提供资源的人补条件；对反复改变说法、只给口头承诺、不断制造情绪的人减少投入。谈话时只说目标、条件、时间、责任四项，不说含糊话。对方如果不能明确回答，就按“暂时不能成”处理，不继续消耗。

【第三步：定时间】把行动分为七天、三十天、九十天三个阶段。七天内完成第一次实质动作，例如联系、提交、确认、见面或停止一项无效投入；三十天内检查是否出现清楚回应、资源到位或关系改善；九十天内只保留真正有结果的路径。若三十天仍没有任何实质变化，就主动换方法，不在原路等待。

【第四步：守边界】涉及钱财，要先定最高投入和退出条件；涉及感情，要看对方是否持续行动；涉及工作，要核对职责、权限和回报；涉及合作，要把分工、期限和违约处理写清；涉及家庭，要区分情分与责任。盘面显示的助力可以用，但不能把所有希望压在某一个人身上。任何需要你不断解释、不断让步、不断追加投入才能维持的局面，都要重新定界。

d.click()});$$('[data-q]').forEach(b=>b.onclick=()=>run(b.dataset.q));send.onclick=()=>{let q=document.querySelector("#prompt").value.trim();if(q){run(q);document.querySelector("#prompt").value=''}};document.querySelector("#prompt").onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send.click()}};$$('.right-tabs button').forEach(b=>b.onclick=()=>{$$('.right-tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');state.panel=b.dataset.panel;renderPanel()});$$('.inline-tabs button').forEach(b=>b.onclick=()=>{$$('.inline-tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');state.panel=b.dataset.inlinePanel;$$('.right-tabs button').forEach(x=>x.classList.toggle('active',x.dataset.panel===state.panel));renderPanel()});$$('.nav button').forEach(b=>b.onclick=()=>{$$('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');$$('.view').forEach(v=>v.classList.remove('active'));$('#'+b.dataset.view+'View').classList.add('active');if(b.dataset.view==='reports')renderReports();setSidebar(false)});document.querySelector('#newQuestion').onclick=()=>resetChat();saveReport.onclick=()=>{let s=state.sessions.find(x=>x.id===state.activeSessionId);if(!s)return alert('请先完成一次推演');let p=activeProfile();state.reports.unshift({id:String(Date.now()),profileId:p.id,profileName:p.name,mode:s.mode,title:'最终执行结果',summary:`${action.textContent}\n\n宜：${doGood.textContent}\n\n慎：${doCaution.textContent}\n\n忌：${doAvoid.textContent}\n\n喜：${doJoy.textContent}`,createdAt:new Date().toLocaleString()});save();saveReport.textContent='已保存';setTimeout(()=>saveReport.textContent='保存为报告',1000)};load();save();if(!state.profiles.length)openProfile();else modal.classList.remove('open');renderAll();
